# Single-service production stack (SQLite), for an always-on low-memory host
# such as a Raspberry Pi 3B. The app is now one FastAPI process that serves the
# API, the server-rendered UI, and the nightly scheduler — so this is just the
# backend. The native (no-Docker) systemd path in DEPLOY.md is even lighter;
# this is the containerized alternative.
#
#   cp .env.example .env   # set OPENAI_API_KEY / POLYGON_API_KEY / SEC_EDGAR_USER_AGENT
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Then open http://<host>:8000  (UI at /, JSON API under /api).

services:
  app:
    image: greenblatt:prod
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      # SQLite file on a named volume; survives container rebuilds.
      DATABASE_URL: sqlite:////data/greenblatt.db
    volumes:
      - appdata:/data
    ports:
      - "8000:8000"
    # Image default CMD is `uvicorn app.main:app` (no --reload, single worker —
    # the in-process nightly scheduler must not be duplicated across workers).
    restart: unless-stopped
    mem_limit: 480m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  appdata:
